name: Deploy to GitHub Pages

# Pages 以 gh-pages 分支为源；每次推送 main 后自动同步过去
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync main to gh-pages
        run: git push origin HEAD:gh-pages --force
